<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing — Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 18px; background: var(--bg-window); }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .cell { background: var(--surface-alt); border: 1px solid var(--border-subtle); padding: 12px; height: 96px; display: flex; flex-direction: column; justify-content: space-between; }
  .name { font-size: 11px; font-weight: 700; letter-spacing: 0.3px; color: var(--text-secondary); text-transform: uppercase; }
  .px { font-family: 'Cascadia Mono', ui-monospace, monospace; font-size: 12px; color: var(--text-primary); }
  .demo { width: 60px; height: 28px; background: var(--accent); align-self: flex-end; }
</style></head>
<body>
  <div class="grid">
    <div class="cell" style="border-radius:4px"><span class="name">xs / sidebar</span><div class="demo" style="border-radius:4px"></div><span class="px">4px</span></div>
    <div class="cell" style="border-radius:6px"><span class="name">sm / inputs</span><div class="demo" style="border-radius:6px"></div><span class="px">6px</span></div>
    <div class="cell" style="border-radius:8px"><span class="name">md / button</span><div class="demo" style="border-radius:8px"></div><span class="px">8px</span></div>
    <div class="cell" style="border-radius:14px"><span class="name">lg / card</span><div class="demo" style="border-radius:14px"></div><span class="px">14px</span></div>
    <div class="cell" style="border-radius:16px"><span class="name">xl / modal</span><div class="demo" style="border-radius:16px"></div><span class="px">16px</span></div>
  </div>
</body></html>
