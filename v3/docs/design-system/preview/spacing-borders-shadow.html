<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing — Borders &amp; Shadow</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 18px; background: var(--bg-window); display: flex; flex-direction: column; gap: 12px; }
  .row { display: grid; grid-template-columns: 130px 1fr 110px; align-items: center; gap: 12px; }
  .name { font-size: 11px; font-weight: 700; letter-spacing: 0.3px; color: var(--text-secondary); text-transform: uppercase; }
  .px { font-family: 'Cascadia Mono', ui-monospace, monospace; font-size: 11px; color: var(--text-primary); }
  .swatch { background: var(--surface-alt); height: 32px; border-radius: 6px; }
  .glow-card { background: var(--surface-alt); height: 56px; border-radius: 14px; box-shadow: 0 6px 28px rgba(227,161,47,0.22); }
</style></head>
<body>
  <div class="row"><span class="name">subtle-light</span><div class="swatch" style="border:1px solid rgba(255,255,255,0.04)"></div><span class="px">white .04</span></div>
  <div class="row"><span class="name">subtle</span><div class="swatch" style="border:1px solid rgba(255,255,255,0.06)"></div><span class="px">white .06</span></div>
  <div class="row"><span class="name">default</span><div class="swatch" style="border:1px solid rgba(255,255,255,0.08)"></div><span class="px">white .08</span></div>
  <div class="row"><span class="name">light</span><div class="swatch" style="border:1px solid rgba(255,255,255,0.18)"></div><span class="px">white .18</span></div>
  <div class="row"><span class="name">accent</span><div class="swatch" style="border:1px solid rgba(227,161,47,0.35)"></div><span class="px">amber .35</span></div>
  <div class="row"><span class="name">amber-glow</span><div class="glow-card"></div><span class="px">0 6 28 amber.22</span></div>
</body></html>
