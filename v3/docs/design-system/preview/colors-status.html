<!doctype html>
<html><head><meta charset="utf-8"><title>Colors — Status</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 16px; background: var(--bg-window); }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .swatch { border-radius: var(--radius-md); padding: 14px 12px; min-height: 88px; display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--border-subtle); }
  .dot { width: 14px; height: 14px; border-radius: 50%; }
  .name { font-size: 11px; font-weight: 700; letter-spacing: 0.3px; color: var(--text-secondary); text-transform: uppercase; }
  .hex  { font-family: 'Cascadia Mono', ui-monospace, monospace; font-size: 12px; color: var(--text-primary); }
  .ex { font-size: 12px; color: var(--text-secondary); }
</style></head>
<body>
  <div class="row">
    <div class="swatch" style="background:rgba(46,204,113,0.10)"><div class="dot" style="background:#2ECC71"></div><span class="name">success</span><span class="hex">#2ECC71</span><span class="ex">저장 완료</span></div>
    <div class="swatch" style="background:rgba(245,166,35,0.10)"><div class="dot" style="background:#F5A623"></div><span class="name">warning</span><span class="hex">#F5A623</span><span class="ex">입력 오류</span></div>
    <div class="swatch" style="background:rgba(255,77,79,0.10)"><div class="dot" style="background:#FF4D4F"></div><span class="name">error</span><span class="hex">#FF4D4F</span><span class="ex">저장 실패</span></div>
  </div>
</body></html>
