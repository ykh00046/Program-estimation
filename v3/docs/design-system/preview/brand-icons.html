<!doctype html>
<html><head><meta charset="utf-8"><title>Brand — Iconography</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 18px; background: var(--bg-window); }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
  .ico-cell { background: var(--surface-alt); border: 1px solid var(--border-subtle); border-radius: 8px; padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .ico-cell svg { width: 22px; height: 22px; color: #C2CAD8; }
  .ico-cell span { font-size: 10px; color: var(--text-secondary); text-align: center; }
</style></head>
<body>
  <div class="grid">
    <div class="ico-cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3v3l-5 9a4 4 0 0 0 4 6h8a4 4 0 0 0 4-6L15 6V3"/></svg><span>flask-conical<br/>(MIX_VOLUMES)</span></div>
    <div class="ico-cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg><span>pencil<br/>(EDIT)</span></div>
    <div class="ico-cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg><span>clipboard<br/>(PASTE)</span></div>
    <div class="ico-cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 6V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2M3 6h18M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg><span>library<br/>(LIBRARY)</span></div>
    <div class="ico-cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2"/></svg><span>history<br/>(HISTORY)</span></div>
    <div class="ico-cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v6M12 17v6M4.2 4.2l4.2 4.2M15.6 15.6l4.2 4.2M1 12h6M17 12h6"/></svg><span>settings<br/>(SETTING)</span></div>
    <div class="ico-cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>users<br/>(PEOPLE)</span></div>
  </div>
</body></html>
