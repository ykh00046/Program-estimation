<!doctype html>
<html><head><meta charset="utf-8"><title>Brand — Wordmark</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 22px; background: var(--bg-window); display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
  .mark { display: flex; align-items: center; gap: 14px; padding: 14px 22px; background: var(--surface-alt); border: 1px solid var(--border-subtle); border-radius: 14px; }
  .text { display: flex; flex-direction: column; }
  .ko { font-size: 22px; font-weight: 700; color: #F5F7FA; letter-spacing: -0.3px; line-height: 1.1; }
  .en { font-size: 11px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: #E3A12F; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #E3A12F; box-shadow: 0 0 14px rgba(227,161,47,0.6); }
  .note { font-size: 11px; color: var(--text-secondary); font-style: italic; }
</style></head>
<body>
  <div class="mark"><div class="dot"></div><div class="text"><span class="ko">DHR 배합 프로그램</span><span class="en">batch recipe v3</span></div></div>
  <div class="mark" style="background:#0C0F14"><div class="dot"></div><div class="text"><span class="ko">DHR 배합 프로그램</span><span class="en">batch recipe v3</span></div></div>
  <div class="note">Net-new wordmark — source app has no logo. Replace if an official mark exists.</div>
</body></html>
