<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing — Scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 18px; background: var(--bg-window); }
  .row { display: grid; grid-template-columns: 60px 1fr; align-items: center; gap: 14px; padding: 4px 0; }
  .px { font-family: 'Cascadia Mono', ui-monospace, monospace; font-size: 12px; color: var(--text-primary); }
  .bar { height: 14px; background: var(--accent); border-radius: 2px; }
</style></head>
<body>
  <div class="row"><span class="px">4</span><div class="bar" style="width:4px"></div></div>
  <div class="row"><span class="px">6</span><div class="bar" style="width:6px"></div></div>
  <div class="row"><span class="px">8</span><div class="bar" style="width:8px"></div></div>
  <div class="row"><span class="px">12</span><div class="bar" style="width:12px"></div></div>
  <div class="row"><span class="px">14</span><div class="bar" style="width:14px"></div></div>
  <div class="row"><span class="px">16</span><div class="bar" style="width:16px"></div></div>
  <div class="row"><span class="px">20</span><div class="bar" style="width:20px"></div></div>
  <div class="row"><span class="px">24</span><div class="bar" style="width:24px"></div></div>
  <div class="row"><span class="px">28</span><div class="bar" style="width:28px"></div></div>
  <div class="row"><span class="px">32</span><div class="bar" style="width:32px"></div></div>
</body></html>
