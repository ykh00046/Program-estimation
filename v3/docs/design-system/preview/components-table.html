<!doctype html>
<html><head><meta charset="utf-8"><title>Components — Table Row</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 18px; background: var(--bg-window); }
  table { width: 100%; border-collapse: collapse; background: #141A23; border-radius: 8px; overflow: hidden; font-size: 13px; }
  th { background: #10141B; color: #E3A12F; border-bottom: 2px solid #E3A12F; padding: 10px 12px; text-align: left; font-weight: 700; font-size: 12px; }
  td { padding: 12px; height: 48px; border-bottom: 1px solid rgba(255,255,255,0.04); color: #F5F7FA; }
  tr:hover td { background: rgba(227,161,47,0.12); }
  .selected td { background: rgba(227,161,47,0.22); color: #E3A12F; box-shadow: inset 0 0 0 2px #E3A12F; }
  .lot-cell { background: #2A2212; }
  .lot-active { background: #3A1C1C; box-shadow: inset 0 0 0 1px #E3A12F; }
</style></head>
<body>
  <table>
    <thead><tr><th>품목코드</th><th>품목명</th><th>비율(%)</th><th>이론(g)</th><th>자재 LOT</th></tr></thead>
    <tbody>
      <tr><td>M-001</td><td>베이스 폴리머</td><td>62.50</td><td>7,812.500</td><td class="lot-cell">P-26041501</td></tr>
      <tr class="selected"><td>M-014</td><td>가소제 A</td><td>22.30</td><td>2,787.500</td><td class="lot-active">_______________</td></tr>
      <tr><td>M-027</td><td>안정제</td><td>12.20</td><td>1,525.000</td><td class="lot-cell"></td></tr>
      <tr><td>M-099</td><td>안료</td><td>3.00</td><td>375.000</td><td class="lot-cell"></td></tr>
    </tbody>
  </table>
</body></html>
