<!doctype html>
<html><head><meta charset="utf-8"><title>Type — Scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 18px; background: var(--bg-window); }
  .row { display: grid; grid-template-columns: 130px 70px 70px 1fr; align-items: baseline; gap: 14px; padding: 8px 0; border-bottom: 1px solid var(--border-subtle-light); }
  .row:last-child { border: none; }
  .meta { font-size: 11px; color: var(--text-secondary); font-family: 'Cascadia Mono', ui-monospace, monospace; }
  .label { font-size: 11px; font-weight: 700; letter-spacing: 0.3px; color: var(--text-secondary); text-transform: uppercase; }
</style></head>
<body>
  <div class="row"><span class="label">h1 / 30</span><span class="meta">700</span><span class="meta">-0.5px</span><span style="font-size:30px;font-weight:700;letter-spacing:-0.5px;color:#F5F7FA">Welcome Back!</span></div>
  <div class="row"><span class="label">h2 / 24</span><span class="meta">700</span><span class="meta">0</span><span style="font-size:24px;font-weight:700;color:#F5F7FA">DHR 관리 (레시피)</span></div>
  <div class="row"><span class="label">amount / 17</span><span class="meta">600</span><span class="meta">0</span><span style="font-size:17px;font-weight:600;color:#F5F7FA">12,500.00 g</span></div>
  <div class="row"><span class="label">body / 14</span><span class="meta">500</span><span class="meta">0</span><span style="font-size:14px;font-weight:500;color:#F5F7FA">자재 목록 — 배합 비율 합계 100%</span></div>
  <div class="row"><span class="label">caption / 13</span><span class="meta">500</span><span class="meta">0</span><span style="font-size:13px;color:#C2CAD8">PDF 스캔 효과 및 서명 옵션을 관리합니다.</span></div>
  <div class="row"><span class="label">label / 11</span><span class="meta">700</span><span class="meta">0.3px</span><span style="font-size:11px;font-weight:700;letter-spacing:0.3px;color:#C2CAD8;text-transform:uppercase">WORKER NAME *</span></div>
</body></html>
